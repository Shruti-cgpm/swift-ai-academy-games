<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correct It, Then Finish It — Swift AI Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="saa-upgrade.css">
<link rel="stylesheet" href="saa-kit.css">
</head>
<body>
<div class="app">

  <header class="saa-header">
    <div class="saa-brand">
      <img src="assets/logo-mark.webp" alt="">
      <span>SWIFT&nbsp;AI&nbsp;ACADEMY</span>
    </div>
  </header>

  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg></div>
      <div>
        <div class="saa-eyebrow topbar-eyebrow">Lab · MC1 / 1.3</div>
        <div class="topbar-title">Correct It, Then Finish It</div>
        <div class="topbar-sub">AAI-E-MC1-S03-LAB02 · PC 4.1–4.5 · PC 5.1–5.4 · English</div>
      </div>
    </div>
    <span class="gate-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Gates the unit
    </span>
  </div>

  <main class="chat" id="chat" aria-live="polite"></main>

  <footer class="chat-footer">
    <button type="button" class="nav-btn" id="backBtn" aria-label="Back to the previous turn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Back
    </button>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="step-count" id="stepCount">Step 1 of 17</span>
    </div>
  </footer>
</div>

<script src="script.js"></script>
<script src="saa-upgrade.js"></script>
<script src="saa-kit.js"></script>
</body>
</html>
